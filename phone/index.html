<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111418">
<title>Game Optimizer Mobile</title>
<style>
:root{--bg:#111418;--card:#1b2027;--fg:#e8ecf1;--mut:#8a94a3;--acc:#4ade80;--warn:#fbbf24}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f8;--card:#fff;--fg:#14181d;--mut:#5b6573;--acc:#16a34a;--warn:#b45309}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:22px;margin:0 0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--mut);font-size:13px;margin-bottom:6px}
select,input[type=number]{width:100%;padding:12px;border-radius:10px;border:1px solid #0003;background:var(--bg);color:var(--fg);font-size:16px}
.fps{display:flex;flex-wrap:wrap;gap:8px}
.fps button{flex:1 0 28%;padding:12px;border-radius:10px;border:2px solid transparent;background:var(--bg);color:var(--fg);font-size:16px}
.fps button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.fps button:disabled{opacity:.3}
.big{width:100%;padding:16px;border:0;border-radius:12px;background:var(--acc);color:#04210f;font-size:18px;font-weight:700}
.big:disabled{opacity:.4}
.lim{font-size:14px;color:var(--mut);margin-top:8px}
.lim b{color:var(--acc);font-size:18px}
.warn{color:var(--warn)}
li{list-style:none;padding:8px 0;border-bottom:1px solid #0002}
li label{display:flex;gap:10px;color:var(--fg);font-size:15px;margin:0}
li input{width:22px;height:22px;flex:none}
ul{padding:0;margin:0}
.sec{font-size:13px;color:var(--mut);margin:12px 0 2px;text-transform:uppercase}
.sec:first-child{margin-top:0}
a.btn,button.sec2{display:block;text-align:center;margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);color:var(--fg);border:1px solid var(--acc);text-decoration:none;font-size:15px;width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>🥔 Game Optimizer</h1>

<div class="card">
  <label for="game">Игра</label>
  <select id="game"></select>
</div>

<div class="card">
  <label for="phone">Твой телефон</label>
  <select id="phone"></select>
  <div id="custom" hidden style="margin-top:10px">
    <label for="hz">Частота экрана, Гц</label>
    <input id="hz" type="number" min="30" max="240" value="60">
    <label for="tier" style="margin-top:10px">Мощность телефона</label>
    <select id="tier">
      <option value="1">Бюджетный (до 60 FPS)</option>
      <option value="2" selected>Средний (до 90 FPS)</option>
      <option value="3">Мощный (до 120 FPS)</option>
      <option value="4">Флагман (до 144 FPS)</option>
    </select>
  </div>
  <div class="lim" id="lim"></div>
</div>

<div class="card">
  <label>Целевой FPS</label>
  <div class="fps" id="fps"></div>
</div>

<button class="big" id="go">Оптимизировать</button>

<div class="card" id="out" hidden style="margin-top:12px">
  <div id="plan"></div>
  <a class="btn" id="dl" hidden>⬇ Скачать серые текстуры (.mcpack)</a>
  <button class="sec2" id="copy">Скопировать список</button>
</div>

<p class="lim">Приложение не может само менять настройки чужих игр на телефоне (Android/iOS это запрещают) — оно считает точный потолок FPS для твоего телефона и выдаёт список настроек «под картошку». Частоты экранов и классы телефонов приблизительные.</p>

<script>
// hz — частота экрана, tier — класс железа (1 бюджет … 4 флагман)
const PHONES=[
["Samsung Galaxy A15",90,1],["Samsung Galaxy A35",120,2],["Samsung Galaxy A55",120,2],
["Samsung Galaxy S21",120,3],["Samsung Galaxy S23",120,4],["Samsung Galaxy S24",120,4],["Samsung Galaxy S24 Ultra",120,4],
["iPhone 11",60,3],["iPhone 12",60,3],["iPhone 13",60,4],["iPhone 14",60,4],["iPhone 15",60,4],["iPhone 15 Pro",120,4],["iPhone 16 Pro",120,4],
["Xiaomi Redmi 12",90,1],["Xiaomi Redmi Note 12",120,1],["Xiaomi Redmi Note 13",120,2],["Poco X6",120,3],["Poco F6",120,4],
["Google Pixel 6a",60,2],["Google Pixel 7",90,3],["Google Pixel 8",120,4],
["Realme C55",90,1],["Realme 11",120,2],["Infinix Hot 30",90,1],["Tecno Spark 10",90,1],["OnePlus 12",120,4],
];
const TIER_CAP={1:60,2:90,3:120,4:144};
const FPS_OPTS=[30,45,60,90,120,144];

// cap — максимум FPS, который поддерживает сама игра
const GAMES={
"Minecraft (Bedrock)":{cap:144,pack:1,s:{
 "Игра":["Дальность прорисовки: 4 чанка","Красивое небо: выкл","Плавное освещение: выкл","Красивая графика (Fancy): выкл","Частицы: минимум","Облака: выкл"],
 "Видео":["Лимит FPS: {fps}","VSync: выкл","Масштаб интерфейса: 1–2"]}},
"PUBG Mobile":{cap:120,s:{
 "Графика":["Качество графики: Сглаженная (Smooth)","Частота кадров: максимум, доступный для {fps} FPS","Стиль: Классический","Сглаживание: выкл","Тени: выкл"]}},
"Free Fire":{cap:120,s:{
 "Графика":["Графика: Сглаженная","FPS: Высокий/Макс. (ближайший к {fps})","Тени: выкл","Высокое разрешение: выкл"]}},
"Call of Duty Mobile":{cap:120,s:{
 "Графика":["Качество: Низкое","Частота кадров: Макс./Очень высокая (ближайшая к {fps})","Глубина резкости: выкл","Блум: выкл","Тени: выкл","Рэгдолл: выкл"]}},
"Genshin Impact":{cap:60,s:{
 "Графика":["Частота кадров: {fps}","Разрешение: 0.8–1.0","Тени: минимум","Визуальные эффекты: минимум","Сглаживание: выкл","Эффекты объёма: выкл"]}},
"Roblox":{cap:60,s:{
 "Настройки":["Graphics Mode: Manual","Graphics Quality: 1–2","Лимит FPS в приложении: {fps}"]}},
"Brawl Stars":{cap:60,s:{
 "Настройки":["Графика: Низкая","Частота кадров: {fps} FPS","Эффекты экрана: выкл"]}},
};

const COMMON={"Android (системные)":[
 "Режим производительности / Game Mode → Performance",
 "Выключить экономию заряда на время игры",
 "Параметры разработчика: анимации 0.5x или выкл",
 "Закрыть фоновые приложения",
 "Не играть при зарядке 100%→ перегрев сбрасывает FPS"]};

const $=id=>document.getElementById(id);
let target=null,lastText="";

PHONES.forEach(p=>$("phone").add(new Option(p[0])));
$("phone").add(new Option("Другой телефон…"));
Object.keys(GAMES).forEach(g=>$("game").add(new Option(g)));

function phone(){
  if($("phone").value==="Другой телефон…")return{name:"Свой телефон",hz:+$("hz").value||60,tier:+$("tier").value};
  const p=PHONES.find(x=>x[0]===$("phone").value);return{name:p[0],hz:p[1],tier:p[2]};
}
function limit(){
  const p=phone(),g=GAMES[$("game").value];
  const parts=[["экран телефона",p.hz],["мощность телефона",TIER_CAP[p.tier]],["сама игра",g.cap]];
  const max=Math.min(...parts.map(x=>x[1]));
  return{max,by:parts.filter(x=>x[1]===max).map(x=>x[0]).join(", ")};
}
function refresh(){
  $("custom").hidden=$("phone").value!=="Другой телефон…";
  const L=limit();
  $("lim").innerHTML=`Максимум для оптимизации: <b>${L.max} FPS</b> <span>(ограничивает: ${L.by})</span>`;
  const opts=FPS_OPTS.filter(f=>f<=L.max);
  if(!opts.includes(L.max))opts.push(L.max);
  if(!target||target>L.max)target=L.max;
  $("fps").innerHTML="";
  opts.forEach(f=>{const b=document.createElement("button");b.textContent=f;
    b.className=f===target?"on":"";b.onclick=()=>{target=f;refresh()};$("fps").append(b)});
  $("out").hidden=true;
}
["game","phone","hz","tier"].forEach(i=>$(i).addEventListener("input",()=>{target=null;refresh()}));

$("go").onclick=()=>{
  const g=GAMES[$("game").value],p=phone(),L=limit();
  let html="",txt=`${$("game").value} — ${p.name}, цель ${target} FPS (макс. ${L.max})\n`;
  const sections={...g.s,...COMMON};
  for(const [sec,items] of Object.entries(sections)){
    html+=`<div class="sec">${sec}</div><ul>`;txt+=`\n${sec}:\n`;
    items.forEach(it=>{const t=it.replaceAll("{fps}",target);
      html+=`<li><label><input type="checkbox">${t}</label></li>`;txt+=`- ${t}\n`});
    html+="</ul>";
  }
  if(target>60&&p.tier<3)html=`<p class="warn">⚠ ${target} FPS на этом телефоне могут быть нестабильны.</p>`+html;
  if(g.pack)html+=`<div class="sec">Текстуры «картошка»</div><p class="lim">Скачай пак и открой — Minecraft сам импортирует. Включи в Настройки → Глобальные ресурсы. Стены, земля, дерево серые; руды, вода и лава остаются.</p>`;
  $("plan").innerHTML=html;lastText=txt;
  $("dl").hidden=!g.pack;$("out").hidden=false;$("out").scrollIntoView({behavior:"smooth"});
};
$("copy").onclick=()=>{
  if(window.Android)Android.copy(lastText);else navigator.clipboard?.writeText(lastText);
  $("copy").textContent="Скопировано ✓";
};

// ---- генерация серого ресурспака Bedrock (.mcpack = zip) ----
const GRAY={stone:125,cobblestone:115,stonebrick:120,dirt:105,sand:150,gravel:120,netherrack:100,end_stone:160,
 brick:130,planks_oak:135,planks_spruce:125,planks_birch:150,planks_jungle:130,planks_acacia:130,planks_big_oak:100,
 log_oak:120,log_oak_top:130,log_spruce:105,log_birch:170,leaves_oak_opaque:90,sandstone_top:150,sandstone_normal:150,
 grass_top:110,grass_side:110,clay:130,snow:200,bookshelf:130};
const CRC=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=~0;for(const x of b)c=CRC[(c^x)&255]^(c>>>8);return~c>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const [name,data] of files){
    const n=enc.encode(name),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint32(14,crc,true);
    h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,n.length,true);
    parts.push(new Uint8Array(h.buffer),n,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,crc,true);
    c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),n);
    off+=30+n.length+data.length;
  }
  const csize=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
  e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)]);
}
function png(g){return new Promise(r=>{const c=document.createElement("canvas");c.width=c.height=16;
  const x=c.getContext("2d");x.fillStyle=`rgb(${g},${g},${g})`;x.fillRect(0,0,16,16);
  c.toBlob(b=>b.arrayBuffer().then(a=>r(new Uint8Array(a))))})}
$("dl").onclick=async e=>{
  e.preventDefault();
  const enc=new TextEncoder(),u=()=>{const r=crypto.getRandomValues(new Uint8Array(16));r[6]=r[6]&15|64;r[8]=r[8]&63|128;
    const h=[...r].map(x=>x.toString(16).padStart(2,"0")).join("");
    return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`};
  const manifest=JSON.stringify({format_version:2,header:{name:"Potato Gray",description:"Серые текстуры для FPS",
    uuid:u(),version:[1,0,0],min_engine_version:[1,16,0]},modules:[{type:"resources",uuid:u(),version:[1,0,0]}]});
  const files=[["manifest.json",enc.encode(manifest)]];
  for(const [n,g] of Object.entries(GRAY))files.push([`textures/blocks/${n}.png`,await png(g)]);
  const blob=zip(files);
  if(window.Android){
    const fr=new FileReader();
    fr.onload=()=>Android.saveFile(fr.result.split(",")[1],"PotatoGray.mcpack");
    fr.readAsDataURL(blob);return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="PotatoGray.mcpack";a.click();
};
refresh();
</script>
</body>
</html>
