plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ginn'
    compileSdk 34

    defaultConfig {
        applicationId 'app.ginn'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // Published APKs are release builds (not debuggable: no run-as / JDWP / WebView DevTools access to the
    // stored AI key). CI signs them with the GINN_KEYSTORE* secrets when present, otherwise with the debug key.
    def releaseKeystore = System.getenv('GINN_KEYSTORE')
    def hasReleaseKey = releaseKeystore && new File(releaseKeystore).exists()

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('GINN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GINN_KEY_ALIAS')
                keyPassword System.getenv('GINN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The shared web UI (repo/ui) is packaged as APK assets: index.html sits at the assets root.
    sourceSets.main.assets.srcDirs = ['../../ui']
}
