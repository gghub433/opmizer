plugins {
    id 'com.android.application'
}

android {
    namespace 'com.potato.optimizer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.potato.optimizer'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // веб-приложение лежит в phone/ и подключается как assets (index.html)
    sourceSets.main.assets.srcDirs = ['../../phone']
}
