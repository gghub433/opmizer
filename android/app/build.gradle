plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ginn'
    compileSdk 34

    defaultConfig {
        applicationId 'app.ginn'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The shared web UI (repo/ui) is packaged as APK assets: index.html sits at the assets root.
    sourceSets.main.assets.srcDirs = ['../../ui']
}
