name: Build APK

on:
  push:
    paths: ['android/**', 'phone/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GameOptimizer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GameOptimizer-apk
          path: GameOptimizer.apk
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GameOptimizer.apk --prerelease \
            --target "${{ github.sha }}" --title "Game Optimizer APK" \
            --notes "Скачай GameOptimizer.apk на телефон и установи (разреши установку из неизвестных источников)."
